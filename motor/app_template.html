<!DOCTYPE html>
<html lang="es">
<head>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --navy:#050F20; --coral:#FD513B; --bg:#f6f6f3; --ink:#0f1a2e; --muted:#66728a; --line:rgba(15,26,46,.09); --card:#fff; --r:20px; --hh:132px; --paper:#f4f1ea }
* { box-sizing: border-box }

body { margin:0; color:var(--ink); font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; -webkit-font-smoothing:antialiased; letter-spacing:-.01em;

button, input, select { font-family: inherit; letter-spacing: inherit }

.grp { padding: 14px 0; border-bottom: 1px solid var(--line) }

.sug { position:absolute; left:0; right:0; top: calc(100% + 6px); background:#fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px -12px rgba(15,26,46,.3); z-index: 8; overflow:hidden; max-height: 260px; overflow-y:auto }

.grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(246px, 1fr)); gap: 18px }
.card { all: unset; cursor: pointer; background: var(--card); border-radius: var(--r); overflow:hidden; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(15,26,46,.04), 0 10px 24px -16px rgba(15,26,46,.22); display:flex; flex-direction: column; transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s; padding: 6px }

.meta { display:flex; gap: 12px; font-size: 12px; font-weight: 500; color: var(--muted); flex-wrap: wrap; align-items:center }

.pips { display:inline-flex; gap: 2px; vertical-align: -1px } .pips i { width: 4px; height: 10px; border-radius: 2px; background: #d9dce4 } .pips i.on { background:#1f9d55 }
.src { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-top: auto; display:flex; align-items:center; gap:7px }

.more { display:block; margin: 26px auto 0; border:0; background: var(--navy); color:#fff; font-weight: 700; padding: 12px 22px; border-radius: 999px; cursor:pointer }
.empty { text-align:center; padding: 80px 20px; color: var(--muted); font-weight: 600 }
.scrim { display:none }
.modal { position: fixed; inset: 0; background: rgba(5,15,32,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display:none; align-items: flex-start; justify-content: center; overflow:auto; padding: 22px 10px; z-index: 10 }
.modal.open { display:flex }
.sheet { position: relative; width: min(680px, 100%) }
.close { position:absolute; top:-10px; right:-6px; width: 36px; height: 36px; border-radius: 50%; border:0; background:#fff; color: var(--navy); font-size: 21px; font-weight: 800; cursor:pointer; box-shadow: 0 2px 8px rgba(0,0,0,.25); z-index: 2 }
.f { background:#fff; border-radius: 24px; overflow: hidden; box-shadow: 0 30px 80px -10px rgba(0,0,0,.5) }
.fh { display:flex; align-items: center; gap: 12px; padding-right: 14px; border-bottom: 4px solid var(--c); min-height: 50px }
.fh .bl { align-self: stretch; display:flex; align-items:center; padding: 0 12px; background: var(--c); color: var(--k); font-weight: 800; font-size: 10.5px; letter-spacing: .7px; text-transform: uppercase; max-width: 130px; line-height: 1.15 }

.fdia svg { width: 100%; height: 100% }

.strip { display:grid; grid-template-columns: repeat(4, 1fr); background:#f1ece2; border-bottom: 1px solid var(--line) }
.strip span { display:flex; align-items:center; justify-content:center; gap: 6px; padding: 9px 4px; font-size: 13px; font-weight: 700; border-right: 1px solid var(--line); text-align: center }

.strip svg { width: 14px; height: 14px; flex: none }
.fb { padding: 14px 18px 18px; font-size: 14.5px; line-height: 1.5; color: #1d2a45 }
.fb h5 { margin: 12px 0 3px; font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--navy) }
.fb p { margin: 0 }
.obj { font-weight: 600; font-style: italic; color: var(--navy); border-left: 4px solid var(--c); padding-left: 10px; margin-bottom: 4px !important }
mark { background: linear-gradient(transparent 60%, rgba(240,83,63,.28) 60%); color: var(--navy); font-weight: 700 }
.cons { display:flex; gap: 8px; align-items:flex-start; margin: 14px 0 6px !important }
.chip { background: var(--coral); color:#fff; font-size: 10px; font-weight: 800; letter-spacing: .7px; padding: 3px 7px; border-radius: 4px; flex: none; margin-top: 2px }
.cons em { font-weight: 800; color: var(--navy); font-size: 15px }
.vars { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; background: var(--paper); border-radius: 9px; padding: 4px 12px 10px; margin: 10px 0 }
.badges { display:flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px }
.badge { font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 6px; background: var(--paper) }
.badge.book { background: var(--c); color: var(--k) }
.fsrc { font-size: 12px; color: #8a93a6; border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px }
.nav { display:flex; justify-content: space-between; margin-top: 10px }
.nav button { border:0; background:#fff; color: var(--navy); font-weight: 800; font-size: 13px; padding: 9px 14px; border-radius: 9px; cursor: pointer }
@media (max-width: 560px) { .vars { grid-template-columns: 1fr } .strip { grid-template-columns: 1fr 1fr } .strip span:nth-child(2) { border-right: 0 } }
@media (max-width: 920px) {
  .top { padding: 10px 14px }
  .row1 { gap: 10px; flex-wrap: wrap } .brand img { height: 42px }
  .search { order: 3; flex-basis: 100%; max-width: none }
  .count { display:none } .btn-f { display:block; margin-left:auto }
  .wrap { grid-template-columns: 1fr; padding: 16px 14px 90px } .grid { gap: 14px; grid-template-columns: 1fr 1fr } 
  .side { position: fixed; left:0; right:0; bottom:0; top:auto; max-height: 86vh; border-radius: 26px 26px 0 0; z-index: 40; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); background:#fff; padding: 0 18px 100px }
  .side.open { transform:none }
  .side .dh { display:flex; align-items:center; justify-content:space-between; padding: 18px 0 6px; position: sticky; top:0; background:#fff; z-index:2; font-weight:800; font-size:17px }
  .side .dh button { border:0; background: rgba(15,26,46,.08); width:32px; height:32px; border-radius:50%; font-size:18px; cursor:pointer }
  .side .go { display:block !important; position: fixed; left: 18px; right: 18px; bottom: 18px; border:0; background: var(--navy); color:#fff; font-weight:700; font-size:15px; padding: 15px; border-radius: 999px; box-shadow: 0 12px 28px -8px rgba(5,15,32,.6) }
  .scrim.open { display:block; position: fixed; inset:0; background: rgba(5,15,32,.5); z-index: 30 }
  .tool h2 { font-size: 18px }
}
@media (max-width: 520px) { .grid { grid-template-columns: 1fr } }
.side .go { display:none }
.tl { display:inline-block; width:10px; height:10px; border-radius:50%; background:#7c5cff; box-shadow:0 0 0 2px #fff }
.thumb .tl { position:absolute; right:8px; bottom:8px; z-index:2 }
.who { position:absolute; right:9px; bottom:6px; z-index:2; display:flex; align-items:center; gap:4px; max-width:92%; color:rgba(255,255,255,.85); font:600 9.5px/1.2 Inter,sans-serif; letter-spacing:.2px; text-shadow:0 1px 2px rgba(0,0,0,.65),0 0 4px rgba(0,0,0,.4); pointer-events:none }
.who .tl { box-shadow:none; width:6px; height:6px; flex:none }
.who span { display:block; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right }
.who b { font-weight:800; color:#fff } .who em { font-style:normal; font-weight:500; opacity:.85 } .who b+em::before { content:' · ' }
.fdia .who { bottom:8px; right:auto; left:12px; font-size:11px }
.thumb .ph small { display:none }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="row1">
    <div class="brand"><img src="%%LOGO%%" alt="Prètzhèt Ink · Editorial · Libres · Ebooks"></div>
    <label class="search"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Buscar un ejercicio: rondo, 3v2, pared, portero…" autocomplete="off"></label>
    <button class="btn-f" id="tgl">Filtros <b id="nf" hidden>0</b></button>
    <span class="count" id="cnt"></span>
  </div>
  <div class="blocks" id="blocks"></div>
</header>
<div class="scrim" id="scrim"></div>
<div class="wrap">
<aside class="side" id="side">
  <div class="dh">Filtros <button id="cls" aria-label="Cerrar">×</button></div>
  <div class="grp"><h4>Edad y categoría</h4><div class="opts two" id="f-age"></div></div>
  <div class="grp"><h4>Nivel</h4><div class="opts" id="f-lvl"></div></div>
  <div class="grp"><h4>Jugadores</h4><div class="opts" id="f-pl"></div></div>
  <div class="grp"><h4>Entrenador o equipo</h4>
    <div class="org"><input id="f-org" type="text" placeholder="Escribe un nombre…" autocomplete="off"><div class="sug" id="sug" hidden></div></div></div>
  <div class="grp"><h4>Estado</h4><div class="seg" id="f-est"></div></div>

</aside>
<main class="main">
  <div class="tool"><h2 id="ttl"></h2><span class="sp"></span><select id="f-ord"><option value="sc">Mejor puntuados</option><option value="bl">Por bloque</option><option value="az">Alfabético</option><option value="age">Por edad</option></select></div>
  <div class="act" id="act"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No hay ejercicios con estos filtros.</div>
  <button class="more" id="more" hidden>Ver más</button>
</main>
</div>
<div class="modal" id="m" role="dialog" aria-modal="true"><div class="sheet"><button class="close" id="x" aria-label="Cerrar">×</button><div id="slot"></div>
<div class="nav"><button id="prev">← Anterior</button><button id="next">Siguiente →</button></div></div></div>
<script>
const DATA = /*DATA*/null;
const B = DATA.blocks, R = DATA.recs, SVG = DATA.svg;
const AGES = [['Prebenjamín',6,7],['Benjamín',8,9],['Alevín',10,11],['Infantil',12,13],['Cadete',14,15],['Juvenil',16,18],['Sin indicar']];
const LV = ['Fácil','Normal','Medio','Alto'];
const SHORT = ['Calentar','Técnica','Rondo','Posesión','Superior.','Oleada','Finalizar','Defensa','Partido','ABP','Portero','Calma'];
const PL = [['Hasta 6',0,6],['7–10',7,10],['11–14',11,14],['15 o más',15,99],['Sin indicar']];
const EST = [['Todos',''],['Del libro','book'],['TOP ★','tp'],['Probados ✓','pr']];
for (const [L, f] of [[AGES, r => r.a], [PL, r => r.p]]) { if (!R.some(r => !f(r))) { const i = L.findIndex(x => x[1] === undefined); if (i >= 0) L.splice(i, 1); } }
const st = { b:new Set(), a:new Set(), l:new Set(), p:new Set(), org:'', q:'', est:'', ord:'sc' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const norm2 = s => fold(s).replace(/(\d+) ?(?:vs|v|x|:|contra) ?(\d+)/g, '$1v$2').replace(/ ?\+ ?(\d)/g, '+$1');
const stem = w => w.length > 4 ? w.replace(/(es|s)$/, '') : w;
R.forEach(r => { r._t = norm2(r.t); r._m = norm2([r.f, r.s, r.i, B[r.b].n, r.co, r.cl].join(' ')); r._d = norm2(Object.values(r.x).join(' ') + ' ' + (r.ot || '')); });
function qscore(r, words) {
  let sc = 0;
  for (const w of words) {
    const ti = r._t.indexOf(w); let s = 0;
    if (ti >= 0) s = (ti === 0 || r._t[ti-1] === ' ') ? 12 : 7;
    else if (r._m.includes(w)) s = 4;
    else if (r._d.includes(w)) s = 1;
    else return -1;
    sc += s;
  }
  return sc;
}
let store = {}; try { store = JSON.parse(localStorage.getItem('pi-filtros2') || '{}'); } catch(e) {}
const ORG = {}; R.forEach(r => { [r.co, r.cl].forEach(n => { if (n) ORG[n] = (ORG[n]||0) + 1; }); });
const ORGS = Object.keys(ORG).map(n => ({ n, k: fold(n), c: ORG[n] })).sort((a,b) => b.c - a.c);

function blockChips(counts) {
  $('#blocks').innerHTML = B.map((b, i) => `<button class="bchip ${st.b.has(i)?'on':''}" data-i="${i}" style="--c:${b.c};--k:${b.k}"><i style="background:${b.c}"></i>${esc(b.n)} <span>${counts[i]||0}</span></button>`).join('');
  document.querySelectorAll('.bchip').forEach(el => el.onclick = () => { const i=+el.dataset.i; st.b.has(i)?st.b.delete(i):st.b.add(i); apply(); });
}
function opts(id, list, set, sub) {
  $(id).innerHTML = list.map((o, i) => `<button class="opt ${set.has(i)?'on':''}" data-i="${i}">${esc(o[0])}${sub && o[1] !== undefined ? `<small>${sub(o)}</small>` : ''}</button>`).join('');
  $(id).querySelectorAll('.opt').forEach(el => el.onclick = () => { const i=+el.dataset.i; set.has(i)?set.delete(i):set.add(i); apply(); });
}
function lvls() { $('#f-lvl').innerHTML = LV.map((o, i) => `<button class="opt ${st.l.has(i)?'on':''}" data-i="${i}">${pips(o)} ${o}</button>`).join(''); $('#f-lvl').querySelectorAll('.opt').forEach(el => el.onclick = () => { const i=+el.dataset.i; st.l.has(i)?st.l.delete(i):st.l.add(i); apply(); }); }
function est() { $('#f-est').innerHTML = EST.map(e => `<button class="${st.est===e[1]?'on':''}" data-v="${e[1]}">${e[0]}</button>`).join(''); $('#f-est').querySelectorAll('button').forEach(el => el.onclick = () => { st.est = el.dataset.v; apply(); }); }

function match(r, skipBlock) {
  if (st.est === 'book' && !r.lb) return false;
  if (st.est === 'tp' && !r.tp) return false;
  if (st.est === 'pr' && !r.pr) return false;
  if (st.org && r.co !== st.org && r.cl !== st.org) return false;
  if (!skipBlock && st.b.size && !st.b.has(r.b)) return false;
  if (st.l.size && ![...st.l].some(i => LV[i] === r.n)) return false;
  if (st.a.size && ![...st.a].some(i => { const a = AGES[i]; if (!a[1]) return !r.a; return r.a && r.a[0] <= a[2] && r.a[1] >= a[1]; })) return false;
  if (st.p.size && ![...st.p].some(i => { const p = PL[i]; if (p[1] === undefined) return !r.p; return r.p && r.p[0] <= p[2] && r.p[1] >= p[1]; })) return false;
  if (st.q) { const sc = qscore(r, qwords); if (sc < 0) return false; r._s = sc; }
  return true;
}
let list = [], shown = 0, qwords = [];
const SORT = { sc:(a,b)=>(b.tp?1:0)-(a.tp?1:0)||(b.lb?1:0)-(a.lb?1:0)||b.sc-a.sc||(b.dg||0)-(a.dg||0), bl:(a,b)=>a.b-b.b||(b.sc-a.sc), az:(a,b)=>a.t.localeCompare(b.t,'es'), age:(a,b)=>((a.a||[99])[0])-((b.a||[99])[0]) };
function tags() {
  const t = [];
  st.b.forEach(i => t.push([B[i].n, () => st.b.delete(i)]));
  st.a.forEach(i => t.push([AGES[i][0], () => st.a.delete(i)]));
  st.l.forEach(i => t.push(['Nivel ' + LV[i].toLowerCase(), () => st.l.delete(i)]));
  st.p.forEach(i => t.push([PL[i][0] + ' jug.', () => st.p.delete(i)]));
  if (st.org) t.push([st.org, () => st.org = '']);
  if (st.est) t.push([EST.find(e => e[1] === st.est)[0], () => st.est = '']);
  if (st.q) t.push(['«' + st.q + '»', () => { st.q = ''; $('#q').value = ''; }]);
  $('#act').innerHTML = t.map((x, i) => `<span class="tag">${esc(x[0])}<button data-i="${i}" aria-label="Quitar">×</button></span>`).join('') + (t.length > 1 ? '<button class="clear" id="clr">Quitar todo</button>' : '');
  $('#act').querySelectorAll('.tag button').forEach(el => el.onclick = () => { t[+el.dataset.i][1](); apply(); });
  const c = $('#clr'); if (c) c.onclick = () => { st.b.clear(); st.a.clear(); st.l.clear(); st.p.clear(); st.org = ''; st.est = ''; st.q = ''; $('#q').value = ''; apply(); };
  return t.length;
}
function apply() {
  qwords = norm2(st.q || '').split(/\s+/).filter(Boolean).map(stem);
  const counts = {}; R.forEach(r => { if (match(r, true)) counts[r.b] = (counts[r.b]||0) + 1; });
  blockChips(counts); opts('#f-age', AGES, st.a, o => o[2] ? o[1] + '–' + o[2] : ''); lvls(); opts('#f-pl', PL, st.p); est();
  list = R.filter(r => match(r)).sort(st.q ? ((a,b) => (b._s - a._s) || SORT[st.ord](a,b)) : SORT[st.ord]);
  const nf = tags() - st.b.size - (st.q ? 1 : 0);
  $('#nf').hidden = !nf; $('#nf').textContent = nf;
  const n = list.length.toLocaleString('es-ES');
  $('#cnt').textContent = n + ' ejercicios'; $('#ttl').innerHTML = `${n}<small>ejercicios</small>`; $('#go').textContent = `Ver ${n} ejercicios`;
  $('#grid').innerHTML = ''; shown = 0; more();
  $('#empty').hidden = list.length > 0;
  try { localStorage.setItem('pi-filtros2', JSON.stringify({b:[...st.b],a:[...st.a],l:[...st.l],p:[...st.p],org:st.org,est:st.est,ord:st.ord})); } catch(e) {}
}
function pips(n) { const k = Math.max(1, LV.indexOf(n) + 1); return `<b class="pips">${[0,1,2,3].map(i=>`<i class="${i<k?'on':''}"></i>`).join('')}</b>`; }
function ageTxt(r) { return r.a ? (r.a[0] === r.a[1] ? r.a[0] + ' años' : `${r.a[0]}–${r.a[1]} años`) : 'Edad libre'; }
function plTxt(r) { return r.p ? (r.p[0] === r.p[1] ? r.p[0] + ' jug.' : `${r.p[0]}–${r.p[1]} jug.`) : 'Jug. libre'; }
function thumb(r) {
  return SVG[r.i] ? SVG[r.i] : `<div class="ph"><div class="bk"></div><div class="fx">${esc(r.f || SHORT[r.b])}</div><small>Diagrama pendiente</small></div>`;
}
function who(r) {
  if (!(r.co || r.cl)) return r.tl ? `<i class="tl" title="toplidercoach"></i>` : '';
  return `<div class="who" title="${esc([r.co, r.cl].filter(Boolean).join(' · '))}">${r.tl?'<i class="tl"></i>':''}<span>${r.co?`<b>${esc(r.co)}</b>`:''}${r.cl?`<em>${esc(r.cl)}</em>`:''}</span></div>`;
}
function card(r, idx) {
  const b = B[r.b];
  return `<button class="card" data-k="${idx}" style="--c:${b.c};--k:${b.k}">
  <div class="thumb">${thumb(r)}${who(r)}${r.tp?`<span class="flag tp">★ TOP</span>`:''}${r.lb&&!r.tp?`<span class="flag book">En el libro</span>`:''}${r.pr?`<span class="flag pr">✓ Probado</span>`:''}</div>
  <div class="cb"><div class="ct"><h3>${esc(r.t)}</h3>${r.f?`<span class="fmt">${esc(r.f)}</span>`:''}</div>
  <div class="meta"><span>${ageTxt(r)}</span><span>${pips(r.n)}${esc(r.n)}</span><span>${plTxt(r)}</span></div>
  <div class="src"><i></i>${esc(b.n)}</div></div></button>`;
}
function more() {
  const next = list.slice(shown, shown + 60);
  $('#grid').insertAdjacentHTML('beforeend', next.map((r, j) => card(r, shown + j)).join(''));
  shown += next.length; $('#more').hidden = shown >= list.length;
}
$('#more').onclick = more;
new IntersectionObserver(e => { if (e[0].isIntersecting && shown < list.length) more(); }, { rootMargin: '600px' }).observe($('#more'));
$('#grid').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) open(+c.dataset.k); });

const IC = {
 clock:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 4.6V8l2.4 1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
 user:'<svg viewBox="0 0 16 16"><circle cx="8" cy="5" r="3" fill="currentColor"/><path d="M2.5 14.5c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5z" fill="currentColor"/></svg>',
 area:'<svg viewBox="0 0 16 16"><path d="M2 5V2h3M11 2h3v3M14 11v3h-3M5 14H2v-3" fill="none" stroke="currentColor" stroke-width="1.9"/><rect x="6" y="6" width="4" height="4" fill="currentColor"/></svg>' };
let cur = 0;
function sec(h, t, cls) { return t ? `<h5>${h}</h5><p${cls?` class="${cls}"`:''}>${cls==='pt'?`<mark>${esc(t)}</mark>`:esc(t)}</p>` : ''; }
function full(r) {
  const b = B[r.b], x = r.x;
  const cues = x.cues ? x.cues.replace(/»\s*«/g,' · ').replace(/[«»]/g,'').trim() : '';
  return `<article class="f" style="--c:${b.c};--k:${b.k}">
  <header class="fh"><span class="bl">${esc(b.n)}</span><h2>${esc(r.t)}</h2>${r.f?`<span class="fmt">${esc(r.f)}</span>`:''}</header>
  <div class="fdia">${SVG[r.i] || `<div class="ph" style="height:100%"><div class="bk"></div><div class="fx">${esc(r.f || SHORT[r.b])}</div><small>Diagrama pendiente</small></div>`}${who(r)}<span class="code">${esc(r.i)}</span></div>
  <div class="strip"><span>${IC.clock}${ageTxt(r)}</span><span>${pips(r.n)}${esc(r.n)}</span><span>${IC.user}${plTxt(r)}</span><span>${IC.area}${esc(x.sp || '—')}</span></div>
  <div class="fb">
   <div class="badges">${r.tp?`<span class="badge tp">★ TOP</span>`:''}${r.pr?`<span class="badge pr">✓ Probado en campo</span>`:''}${r.lb?`<span class="badge book">En el libro · nº ${r.lb} del bloque</span>`:''}${r.ar?`<span class="badge">${esc(r.ar)}</span>`:''}</div>
   ${r.tp?`<p class="tpw"><b>Por qué es TOP:</b> ${esc(r.tp)}</p>`:''}
   ${x.obj?`<p class="obj">${esc(x.obj)}</p>`:''}
   ${x.ctx?sec('Cuándo usarlo', x.ctx):''}
   ${sec('Montaje', x.mont)}${sec(x.mont?'Juego':'Cómo se juega', x.how)}${sec('Reglas', x.rules)}${sec('Punto', x.pts, 'pt')}
   ${x.avoid?`<h5>Evitar</h5><p>${esc(x.avoid)}</p>`:''}
   ${cues?`<p class="cons"><span class="chip">CONSIGNA</span><em>${esc(cues)}</em></p>`:''}
   ${(x.fac||x.dif)?`<div class="vars"><div><h5>Más fácil</h5><p>${esc(x.fac||'—')}</p></div><div><h5>Más difícil</h5><p>${esc(x.dif||'—')}</p></div></div>`:sec('Variantes', x.var)}
   ${sec('Duración', x.dur)}${sec('Series', x.ser)}${sec('Por edades', x.adapt)}${sec('Notas', x.notes)}
   <p class="fsrc">Fuente: ${esc(r.sl)}${r.ot?` · «${esc(r.ot)}»`:''}${r.ref?` · ${esc(r.ref)}`:''}</p>
  </div></article>`;
}
function open(k) { if (!list.length) return; cur = (k + list.length) % list.length; $('#slot').innerHTML = full(list[cur]); $('#m').classList.add('open'); $('#m').scrollTop = 0; }
function close() { $('#m').classList.remove('open'); }
$('#x').onclick = close; $('#m').addEventListener('click', e => { if (e.target === $('#m')) close(); });
$('#prev').onclick = () => open(cur - 1); $('#next').onclick = () => open(cur + 1);
document.addEventListener('keydown', e => { if (!$('#m').classList.contains('open')) return; if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') open(cur + 1); if (e.key === 'ArrowLeft') open(cur - 1); });


const side = $('#side'), scrim = $('#scrim');
function sheet(o) { side.classList.toggle('open', o); scrim.classList.toggle('open', o); }
$('#tgl').onclick = () => sheet(true); $('#cls').onclick = $('#go').onclick = scrim.onclick = () => sheet(false);
let qt; $('#q').oninput = e => { clearTimeout(qt); qt = setTimeout(() => { st.q = e.target.value.trim(); apply(); }, 180); };
$('#f-ord').onchange = e => { st.ord = e.target.value; apply(); };
const oi = $('#f-org'), sug = $('#sug'); let hi = -1, cur2 = [];
function sugs() {
  const k = fold(oi.value.trim());
  if (!k) { sug.hidden = true; return; }
  cur2 = ORGS.filter(o => o.k.includes(k)).sort((a,b) => (b.k.startsWith(k)) - (a.k.startsWith(k)) || b.c - a.c).slice(0, 8); hi = cur2.length ? 0 : -1;
  sug.innerHTML = cur2.length ? cur2.map((o, i) => `<button data-i="${i}" class="${i===hi?'hi':''}">${esc(o.n)}<small>${o.c}</small></button>`).join('') : '<div class="none">Sin resultados</div>';
  sug.hidden = false;
  sug.querySelectorAll('button').forEach(el => el.onmousedown = e => { e.preventDefault(); pick(+el.dataset.i); });
}
function pick(i) { if (!cur2[i]) return; st.org = cur2[i].n; oi.value = ''; sug.hidden = true; apply(); }
oi.oninput = sugs; oi.onblur = () => setTimeout(() => sug.hidden = true, 120); oi.onfocus = sugs;
oi.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); pick(hi); } else if (e.key === 'Escape') { sug.hidden = true; } };
function hh() { document.documentElement.style.setProperty('--hh', $('#top').offsetHeight + 'px'); }
addEventListener('resize', hh); hh(); if (document.fonts) document.fonts.ready.then(hh);
if (store.b) { (store.b||[]).forEach(i=>st.b.add(i)); (store.a||[]).forEach(i=>st.a.add(i)); (store.l||[]).forEach(i=>st.l.add(i)); (store.p||[]).forEach(i=>st.p.add(i)); Object.assign(st, { org: store.org||'', est: store.est||'', ord: store.ord||'sc' }); }
$('#f-ord').value = st.ord;
apply(); hh();
</script>
</body>
