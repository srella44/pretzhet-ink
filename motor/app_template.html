<script>
const DATA = /*DATA*/null;
const B = DATA.blocks, R = DATA.recs, SVG = DATA.svg;
const AGES = [['Prebenjamín',6,7],['Benjamín',8,9],['Alevín',10,11],['Infantil',12,13],['Cadete',14,15],['Juvenil',16,18],['Sin indicar']];
const LV = ['Fácil','Normal','Medio','Alto'];
const SHORT = ['Calentar','Técnica','Rondo','Posesión','Superior.','Oleada','Finalizar','Defensa','Partido','ABP','Portero'];
const PL = [['Hasta 6',0,6],['7–10',7,10],['11–14',11,14],['15 o más',15,99],['Sin indicar']];
const EST = [['Todos',''],['Del libro','book'],['TOP ★','tp'],['Probados ✓','pr'],['Favoritos ♥','fav']];
let me = { fav: [], ses: [] }, favSet = new Set();
for (const [L, f] of [[AGES, r => r.a], [PL, r => r.p]]) { if (!R.some(r => !f(r))) { const i = L.findIndex(x => x[1] === undefined); if (i >= 0) L.splice(i, 1); } }
let home = false;
const st = { b:new Set(), a:new Set(), l:new Set(), p:new Set(), org:'', q:'', est:'', ord:'sc' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const norm2 = s => fold(s).replace(/(\d+) ?(?:vs|v|x|:|contra) ?(\d+)/g, '$1v$2').replace(/ ?\+ ?(\d)/g, '+$1');
const stem = w => w.length > 4 ? w.replace(/(es|s)$/, '') : w;
R.forEach(r => { r._t = norm2(r.t); r._m = norm2([r.f, r.s, r.i, B[r.b].n, r.co, r.cl].join(' ')); r._d = norm2(Object.values(r.x).join(' ') + ' ' + (r.ot || '')); });
function qscore(r, words) {
  let sc = 0;
  for (const w of words) {
    const ti = r._t.indexOf(w); let s = 0;
    if (ti >= 0) s = (ti === 0 || r._t[ti-1] === ' ') ? 12 : 7;
    else if (r._m.includes(w)) s = 4;
    else if (r._d.includes(w)) s = 1;
    else return -1;
    sc += s;
  }
  return sc;
}
let store = {}; try { store = JSON.parse(localStorage.getItem('pi-filtros2') || '{}') || {}; } catch(e) {}
const ORG = {}; R.forEach(r => { [r.co, r.cl].forEach(n => { if (n) ORG[n] = (ORG[n]||0) + 1; }); });
const ORGS = Object.keys(ORG).map(n => ({ n, k: fold(n), c: ORG[n] })).sort((a,b) => b.c - a.c);

function blockChips(counts) {
  $('#blocks').innerHTML = B.map((b, i) => `<button class="bchip ${st.b.has(i)?'on':''}" data-i="${i}" style="--c:${b.c};--k:${b.k}"><i style="background:${b.c}"></i>${esc(b.n)} <span>${counts[i]||0}</span></button>`).join('');
  document.querySelectorAll('.bchip').forEach(el => el.onclick = () => { const i=+el.dataset.i; st.b.has(i)?st.b.delete(i):st.b.add(i); apply(); });
}
function opts(id, list, set, sub) {
  $(id).innerHTML = list.map((o, i) => `<button class="opt ${set.has(i)?'on':''}" data-i="${i}">${esc(o[0])}${sub && o[1] !== undefined ? `<small>${sub(o)}</small>` : ''}</button>`).join('');
  $(id).querySelectorAll('.opt').forEach(el => el.onclick = () => { const i=+el.dataset.i; set.has(i)?set.delete(i):set.add(i); apply(); });
}
function lvls() { $('#f-lvl').innerHTML = LV.map((o, i) => `<button class="opt ${st.l.has(i)?'on':''}" data-i="${i}">${pips(o)} ${o}</button>`).join(''); $('#f-lvl').querySelectorAll('.opt').forEach(el => el.onclick = () => { const i=+el.dataset.i; st.l.has(i)?st.l.delete(i):st.l.add(i); apply(); }); }
function est() { $('#f-est').innerHTML = EST.map(e => `<button class="${st.est===e[1]?'on':''}" data-v="${e[1]}">${e[0]}</button>`).join(''); $('#f-est').querySelectorAll('button').forEach(el => el.onclick = () => { st.est = el.dataset.v; apply(); }); }

function match(r, skipBlock) {
  if (st.est === 'book' && !r.lb) return false;
  if (st.est === 'tp' && !r.tp) return false;
  if (st.est === 'pr' && !r.pr) return false;
  if (st.est === 'fav' && !favSet.has(r.i)) return false;
  if (st.org && r.co !== st.org && r.cl !== st.org) return false;
  if (!skipBlock && st.b.size && !st.b.has(r.b)) return false;
  if (st.l.size && ![...st.l].some(i => LV[i] === r.n)) return false;
  if (st.a.size && ![...st.a].some(i => { const a = AGES[i]; if (!a[1]) return !r.a; return r.a && r.a[0] <= a[2] && r.a[1] >= a[1]; })) return false;
  if (st.p.size && ![...st.p].some(i => { const p = PL[i]; if (p[1] === undefined) return !r.p; return r.p && r.p[0] <= p[2] && r.p[1] >= p[1]; })) return false;
  if (st.q) { const sc = qscore(r, qwords); if (sc < 0) return false; r._s = sc; }
  return true;
}
let list = [], shown = 0, qwords = [];
const SORT = { sc:(a,b)=>(b.tp?1:0)-(a.tp?1:0)||(b.lb?1:0)-(a.lb?1:0)||b.sc-a.sc||(b.dg||0)-(a.dg||0), bl:(a,b)=>a.b-b.b||(b.sc-a.sc), az:(a,b)=>a.t.localeCompare(b.t,'es'), age:(a,b)=>((a.a||[99])[0])-((b.a||[99])[0]) };
function tags() {
  const t = [];
  st.b.forEach(i => t.push([B[i].n, () => st.b.delete(i)]));
  st.a.forEach(i => t.push([AGES[i][0], () => st.a.delete(i)]));
  st.l.forEach(i => t.push(['Nivel ' + LV[i].toLowerCase(), () => st.l.delete(i)]));
  st.p.forEach(i => t.push([PL[i][0] + ' jug.', () => st.p.delete(i)]));
  if (st.org) t.push([st.org, () => st.org = '']);
  if (st.est) t.push([EST.find(e => e[1] === st.est)[0], () => st.est = '']);
  if (st.q) t.push(['«' + st.q + '»', () => { st.q = ''; $('#q').value = ''; }]);
  $('#act').innerHTML = t.map((x, i) => `<span class="tag">${esc(x[0])}<button data-i="${i}" aria-label="Quitar">×</button></span>`).join('') + (t.length > 1 ? '<button class="clear" id="clr">Quitar todo</button>' : '');
  $('#act').querySelectorAll('.tag button').forEach(el => el.onclick = () => { t[+el.dataset.i][1](); apply(); });
  const c = $('#clr'); if (c) c.onclick = () => { st.b.clear(); st.a.clear(); st.l.clear(); st.p.clear(); st.org = ''; st.est = ''; st.q = ''; $('#q').value = ''; apply(); };
  return t.length;
}
function go() { home = false; apply(); scrollTo(0, 0); }
function goHome() { st.b.clear(); st.a.clear(); st.l.clear(); st.p.clear(); st.org = ''; st.est = ''; st.q = ''; $('#q').value = ''; home = false; sheet(false); apply(); scrollTo(0, 0); }
let hl = [];
function renderHome() {
  const tot = R.length, c = {}; R.forEach(r => c[r.b] = (c[r.b]||0) + 1);
  hl = R.filter(r => r.tp).sort(SORT.sc).slice(0, 12);
  $('#home').innerHTML = `<div class="hero"><h1>Todo el fútbol base, a un clic.</h1><p>Un banco de ejercicios con diagrama, montaje, reglas y consignas, listo para llevar al campo. Filtra por tipo, edad, nivel o número de jugadores.</p>

  if (words.length) { const t = r._t + ' ' + r._m + ' ' + r._d; let hit = 0; words.forEach(w => { if (t.includes(w)) hit++; }); s += hit * 18; }
  if (r.p && gs.n > r.p[1] * 2.2) s -= 15;          // muy pocos jugadores por grupo: habría que montar 3 o más grupos
  if (!gs.gk && needsGk(r)) s -= 60;
  const dl = Math.abs(Math.max(0, LV.indexOf(r.n)) - gs.lvl); s += [35, 10, -25, -60][dl];
  s -= [0, 12, 28, 45, 70][ageGap(r)];
  if (recentSet().has(r.i)) s -= 45;
  return s;
}
function candidates(phase) {
  const sel = [...gs.t].map(i => GT[i]); const kw = gs.kw ? norm2(gs.kw).split(/\s+/).filter(w => w.length > 2).map(stem) : [];
  let blocks, words = sel.flatMap(x => x[2]).concat(kw);
  if (phase === 'cal') { blocks = [0, 2]; words = words.concat(['activacion','calentamiento']); }
  else if (phase === 'fin') { blocks = [8]; }
  else blocks = sel.length ? [...new Set(sel.flatMap(x => x[1]))] : [1,2,3,4,5,6,7];
  return R.filter(r => fitsAge(r) && fitsPl(r)).map((r, j) => [r, gscore(r, blocks, words, j + phase.length * 7)]).filter(x => x[1] > -500).sort((a, b) => b[1] - a[1]);
}
function similar(a, b) { const A = new Set(a._t.split(' ').filter(w => w.length > 3)), Bw = b._t.split(' ').filter(w => w.length > 3); if (!Bw.length) return false; return Bw.filter(w => A.has(w)).length / Bw.length >= .6; }
function buildPlan() {
  const nMain = gs.min <= 50 ? 2 : gs.min <= 80 ? 3 : 4;
  const phases = ['cal'].concat(Array(nMain).fill('pri'), ['fin']);
  gpool = { cal: candidates('cal'), pri: candidates('pri'), fin: candidates('fin') };
  const used = []; gplan = phases.map(ph => { const r = pickFrom(gpool[ph], c => !used.some(u => u === c || similar(u, c)), ph === 'pri' ? 40 : 25); if (r) used.push(r); return { ph, r, seen: new Set(r ? [r.i] : []) }; }).filter(x => x.r);
  remember(gplan.map(x => x.r.i));
  // Reparte el tiempo: calentamiento ~15 %, partido final ~20 %, el resto entre la parte principal
  const cal = Math.round(gs.min * .15 / 5) * 5 || 10, fin = Math.round(gs.min * .2 / 5) * 5 || 10, pri = gplan.filter(x => x.ph === 'pri').length || 1;
  const each = Math.max(8, Math.round((gs.min - cal - fin) / pri));
  gplan.forEach(x => x.m = x.ph === 'cal' ? cal : x.ph === 'fin' ? fin : each);
}
function swap(i) {
  const x = gplan[i], pool = gpool[x.ph], others = gplan.filter((y, j) => j !== i).map(y => y.r);
  const ok = c => c !== x.r && !others.some(u => u === c || similar(u, c));
  const c = pickFrom(pool, c => ok(c) && !x.seen.has(c.i), 60) || pickFrom(pool, ok, 60);
  if (c) { x.r = c; x.seen.add(c.i); remember([c.i]); }
  renderPlan();
}
function whyTxt(r) {
  const w = [B[r.b].n, 'nivel ' + fold(r.n), ageTxt(r) + (ageGap(r) ? ' (adáptalo a tu grupo)' : '')];
  if (r.p) w.push(r.p[1] && gs.n > r.p[1] ? `${plTxt(r)}: ${Math.ceil(gs.n / r.p[1])} grupos a la vez` : plTxt(r));
  if (r.tp) w.push('★ TOP'); if (r.pr) w.push('✓ probado'); if (r.lb) w.push('en el libro');
  return w.join(' · ');
}
const PHN = { cal: 'Calentamiento', pri: 'Parte principal', fin: 'Partido final' };
function renderPlan() {
  const tot = gplan.reduce((s, x) => s + x.m, 0);
  $('#gout').innerHTML = gplan.length ? `<div class="gplan"><p class="tot">${gplan.length} ejercicios · ${tot} min de trabajo (sin contar pausas ni explicaciones). Propuesta: revísala y cambia lo que no te encaje.</p>` +
    gplan.map((x, i) => { const r = x.r, b = B[r.b], m0 = minOf(r); return `<div class="gslot"><div class="tm">${x.m}<small>min</small></div><div>
      <span class="ph2">${PHN[x.ph]}</span><b class="t">${esc(r.t)}</b><span class="bk2" style="background:${b.c};color:${b.k}">${esc(b.n)}</span>${r.f ? `<span class="bk2" style="background:#eef1f5">${esc(r.f)}</span>` : ''}
      <p class="why">${esc(whyTxt(r))}${m0 && Math.abs(m0 - x.m) >= 5 ? ` <em>· la ficha indica ${m0} min: ajusta series o pausas</em>` : ''}</p>
      <div class="sa"><button class="btn3" data-v="${i}">Ver ficha</button><button class="btn3" data-c="${i}">↻ Cambiar</button></div></div></div>`; }).join('') +
    `<div class="gbtns"><input class="kw" id="gname" placeholder="Nombre (p. ej. Martes Infantil · finalización)" style="flex:1;min-width:200px"><button class="btn2" id="gsave">Guardar como sesión</button></div>
     <p class="gnote">Solo usa ejercicios del banco. Si un ejercicio pide menos jugadores, se monta en varios grupos a la vez.</p></div>`
    : '<p class="gnote" style="margin-top:16px">No hay ejercicios que encajen con esa edad y ese número de jugadores. Prueba con otra categoría o menos condiciones.</p>';
  $('#gout').querySelectorAll('[data-c]').forEach(el => el.onclick = () => swap(+el.dataset.c));
  $('#gout').querySelectorAll('[data-v]').forEach(el => el.onclick = () => { list = gplan.map(x => x.r); open(+el.dataset.v); });
  const sv2 = $('#gsave'); if (sv2) sv2.onclick = () => {
    const sel = [...gs.t].map(i => GT[i][0]).join(', ');
    const x = newSes($('#gname').value.trim() || ('Sesión ' + AGES[gs.age][0] + (sel ? ' · ' + sel : '')));
    x.ex = gplan.map(y => y.r.i); x.d = `${gs.min} min · ${gs.n} jug.${gs.gk ? ' + ' + gs.gk + ' PT' : ''}`;
    x.nt = 'Creada con «Crear sesión»: ' + gplan.map(y => `${PHN[y.ph]} ${y.m}' – ${y.r.t}`).join(' | ') + (gs.kw ? ' | Pedido: ' + gs.kw : '');
    persist(); toast('Guardada en «' + x.n + '»');
  };
}
function renderGen() {
  const ages = AGES.filter(a => a[1] !== undefined);
  $('#gslot').innerHTML = `<div class="gen"><h2>✦ Crear sesión</h2><p class="sub">Marca qué quieres trabajar y te propongo una sesión con ejercicios del banco: calentamiento, parte principal y partido final. Manda el nivel del grupo; la edad solo orienta.</p>
   <h4>¿Qué quieres trabajar?</h4><div class="gchips" id="gt">${GT.map((g, i) => `<button class="${gs.t.has(i) ? 'on' : ''}" data-i="${i}">${g[0]}</button>`).join('')}</div>
   <input class="kw" id="gkw" placeholder="Algo más concreto (opcional): centros al segundo palo, pared, perfil…" value="${esc(gs.kw)}" style="margin-top:10px">
   <h4>Tu grupo</h4><div class="grow">
    <label>Categoría<select id="gage">${ages.map((a, i) => `<option value="${i}" ${gs.age === i ? 'selected' : ''}>${a[0]} (${a[1]}–${a[2]})</option>`).join('')}</select></label>
    <label>Jugadores de campo<input id="gn" type="number" min="4" max="30" value="${gs.n}"></label>
    <label>Porteros<select id="ggk">${[0,1,2].map(k => `<option ${gs.gk === k ? 'selected' : ''}>${k}</option>`).join('')}</select></label>
    <label>Nivel del grupo<select id="glvl">${LV.map((l, i) => `<option value="${i}" ${gs.lvl === i ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label>Duración<select id="gmin">${[45,60,75,90,105,120].map(m => `<option value="${m}" ${gs.min === m ? 'selected' : ''}>${m} min</option>`).join('')}</select></label>
   </div>
   <div class="gbtns"><button class="btn2" id="gok">Proponer sesión</button>${gplan.length ? '<button class="btn3" id="gre">↻ Otra propuesta</button>' : ''}</div>
   <div id="gout"></div></div>`;
  $('#gt').querySelectorAll('button').forEach(el => el.onclick = () => { const i = +el.dataset.i; gs.t.has(i) ? gs.t.delete(i) : gs.t.add(i); el.classList.toggle('on'); });
  const read = () => { gs.kw = $('#gkw').value.trim(); gs.age = +$('#gage').value; gs.lvl = +$('#glvl').value; gs.n = Math.max(2, +$('#gn').value || 14); gs.gk = +$('#ggk').value; gs.min = +$('#gmin').value; };
  $('#gage').onchange = () => { $('#gmin').value = MIN_AGE(+$('#gage').value); };
  $('#gok').onclick = () => { read(); buildPlan(); renderGen(); };
  if ($('#gre')) $('#gre').onclick = () => { read(); gs.seed++; buildPlan(); renderGen(); };
  if (gplan.length || $('#gok').dataset.done) renderPlan();
}
$('#bgen').onclick = () => { renderGen(); $('#gm').classList.add('open'); $('#gm').scrollTop = 0; };
$('#gx').onclick = () => { $('#gm').classList.remove('open'); apply(); };
$('#gm').addEventListener('click', e => { if (e.target === $('#gm')) { $('#gm').classList.remove('open'); apply(); } });

const side = $('#side'), scrim = $('#scrim');
/* Barra inferior en móvil: reutiliza las acciones de la cabecera */
const TB = { home: () => $('#logo').click(), fil: () => $('#tgl').click(), gen: () => $('#bgen').click(), fav: () => $('#bfav').click(), ses: () => $('#bses').click() };
$('#tabbar').querySelectorAll('button').forEach(b => b.onclick = () => TB[b.dataset.t]());
function tbSync() {
  const n = (id) => +($(id).textContent || 0);
  $('#tnfav').textContent = n('#nfav') || ''; $('#tnses').textContent = n('#nses') || ''; $('#tnf').textContent = $('#nf').hidden ? '' : ($('#nf').textContent || '');

}
new MutationObserver(tbSync).observe($('#top'), { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
if (matchMedia('(max-width: 520px)').matches) $('#q').placeholder = 'Buscar: rondo, 3v2, pared…';

function sheet(o) { side.classList.toggle('open', o); scrim.classList.toggle('open', o); }
$('#tgl').onclick = () => sheet(true); $('#cls').onclick = $('#go').onclick = scrim.onclick = () => sheet(false);

$('#f-ord').onchange = e => { st.ord = e.target.value; apply(); };
const oi = $('#f-org'), sug = $('#sug'); let hi = -1, cur2 = [];
function sugs() {
  const k = fold(oi.value.trim());
  if (!k) { sug.hidden = true; return; }
  cur2 = ORGS.filter(o => o.k.includes(k)).sort((a,b) => (b.k.startsWith(k)) - (a.k.startsWith(k)) || b.c - a.c).slice(0, 8); hi = cur2.length ? 0 : -1;
  sug.innerHTML = cur2.length ? cur2.map((o, i) => `<button data-i="${i}" class="${i===hi?'hi':''}">${esc(o.n)}<small>${o.c}</small></button>`).join('') : '<div class="none">Sin resultados</div>';

}
function pick(i) { if (!cur2[i]) return; st.org = cur2[i].n; oi.value = ''; sug.hidden = true; apply(); }
oi.oninput = sugs; oi.onblur = () => setTimeout(() => sug.hidden = true, 120); oi.onfocus = sugs;

$('#f-ord').value = st.ord;
apply(); hh();
